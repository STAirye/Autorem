# Los tests viven en tests/, y solo ahi. Sin esto, `pytest` recorre el repo entero y
# RECOLECTA los scripts archivados en docs/evanesced/ que calzan con el patron por
# defecto (`test_*.py` / `*_test.py`): los IMPORTA, o sea corre su codigo de nivel de
# modulo -- uno de ellos creaba carpetas y leia refs_tablas/ en cada corrida de la suite.
# Un archivo bajo docs/ es documentacion congelada (CLAUDE.md SS0 regla 7), no una prueba.
# `pytest <ruta>` explicito sigue funcionando igual: testpaths solo aplica sin argumentos.
[pytest]
testpaths = tests
norecursedirs = docs legacy .claude build dist .git __pycache__ refs_tablas catalogos
